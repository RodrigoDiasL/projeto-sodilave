name: Validate application

on:
  push:
    branches: [dev, refactor/remove-prisma]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sodilave-app
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://typecheck:typecheck@localhost:3306/typecheck
      SESSION_SECRET: typecheck-only-secret-with-more-than-32-characters
      APP_URL: https://producao.sodilave.pt
      APP_VERSION: 0.9.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sodilave-app/package-lock.json
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Validate production environment
        run: npm run verify:production
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
