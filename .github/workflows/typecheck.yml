name: Validate application

on:
  push:
    branches: [dev, refactor/remove-prisma]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lower_case_table_names: [0, 1]
    defaults:
      run:
        working-directory: sodilave-app
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://typecheck:typecheck@localhost:3306/typecheck
      SESSION_SECRET: typecheck-only-secret-with-more-than-32-characters
      APP_URL: https://producao.sodilave.pt
      APP_VERSION: 0.9.8
      INITIAL_ADMIN_NAME: CI Admin
      INITIAL_ADMIN_PIN: "12345678"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sodilave-app/package-lock.json
      - name: Start MySQL with platform case rules
        run: |
          docker run -d --name sodilave-mysql \
            -e MYSQL_DATABASE=typecheck \
            -e MYSQL_USER=typecheck \
            -e MYSQL_PASSWORD=typecheck \
            -e MYSQL_ROOT_PASSWORD=root-typecheck \
            -p 3306:3306 \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -utypecheck -ptypecheck" \
            --health-interval=2s --health-timeout=5s --health-retries=60 \
            mysql:8.4 --lower-case-table-names=${{ matrix.lower_case_table_names }}
          for attempt in {1..60}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' sodilave-mysql)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs sodilave-mysql
          exit 1
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Dependency security audit
        run: npm run audit:security
      - name: Validate production environment
        run: npm run verify:production
      - name: Bootstrap SQL database
        run: npm run db:upgrade
      - name: Check database schema
        run: npm run db:check
      - name: SQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: mysql://typecheck:typecheck@localhost:3306/typecheck
          TEST_LOWER_CASE_TABLE_NAMES: ${{ matrix.lower_case_table_names }}
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Production HTTP security checks
        run: npm run test:http
      - name: Package verified build for cPanel
        if: matrix.lower_case_table_names == 0
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync("CPANEL_BUILD.json", JSON.stringify({commit: process.env.GITHUB_SHA, node: process.version, platform: process.platform, arch: process.arch, buildId: fs.readFileSync(".next/BUILD_ID", "utf8").trim()}, null, 2) + "\n")'
          tar --exclude='.next/cache' --exclude='.next/trace' -czf "$RUNNER_TEMP/sodilave-cpanel-build.tar.gz" .next CPANEL_BUILD.json
          sha256sum "$RUNNER_TEMP/sodilave-cpanel-build.tar.gz" > "$RUNNER_TEMP/sodilave-cpanel-build.sha256"
      - name: Upload verified cPanel build
        if: matrix.lower_case_table_names == 0
        uses: actions/upload-artifact@v4
        with:
          name: sodilave-cpanel-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sodilave-cpanel-build.tar.gz
            ${{ runner.temp }}/sodilave-cpanel-build.sha256
          retention-days: 14
          if-no-files-found: error
