name: Typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sodilave-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sodilave-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: mysql://typecheck:typecheck@localhost:3306/typecheck
          SESSION_SECRET: typecheck-only-secret-with-more-than-32-characters
