name: Validate application

on:
  push:
    branches: [dev, refactor/remove-prisma]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: typecheck
          MYSQL_USER: typecheck
          MYSQL_PASSWORD: typecheck
          MYSQL_ROOT_PASSWORD: root-typecheck
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utypecheck -ptypecheck"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: sodilave-app
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://typecheck:typecheck@localhost:3306/typecheck
      SESSION_SECRET: typecheck-only-secret-with-more-than-32-characters
      APP_URL: https://producao.sodilave.pt
      APP_VERSION: 0.9.8
      INITIAL_ADMIN_NAME: CI Admin
      INITIAL_ADMIN_PIN: "12345678"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sodilave-app/package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate production environment
        run: npm run verify:production
      - name: Bootstrap SQL database
        run: npm run db:upgrade
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
